name: CI/CD Pipeline LivrExpress

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-ci:
    name: Backend CI (Symfony & PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, zip
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Installation des dépendances Composer
        run: |
          cd livrexp_backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Préparation de l'environnement de test
        run: |
          cd livrexp_backend
          cp .env.test .env.local || true

      - name: Exécution des tests PHPUnit
        run: |
          cd livrexp_backend
          vendor/bin/phpunit

  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'livrexp_frontend/package-lock.json'

      - name: Installation des dépendances Frontend
        run: |
          cd livrexp_frontend
          npm install

      - name: Verification de la syntaxe et Linter (ESLint)
        run: |
          cd livrexp_frontend
          npm run lint --if-present

      - name: Validation de la compilation Build (Vite)
        run: |
          cd livrexp_frontend
          npm run build
